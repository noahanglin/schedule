<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Rundown</title>
<meta name="description" content="Daily schedule with check-offs, a day timeline and a week board.">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Daily Rundown</h1>
      <p id="dateline">&nbsp;</p>
    </div>
    <div class="controls">
      <label class="wake label" for="wake-input">Wake time <input id="wake-input" type="time" value="11:00" step="900"></label>
      <span class="sync" id="sync" data-s="">Loading…</span>
    </div>
  </header>

  <div class="grid">
    <div class="main">
      <div class="stats" id="stats"></div>

      <!-- Day timeline widget: shown on phone-sized screens in place of the per-row bars. -->
      <section class="panel tl-panel" aria-labelledby="tl-title">
        <div class="panel-h"><h2 id="tl-title">Day timeline</h2><span class="label" id="tl-meta"></span></div>
        <div class="tl" id="tl"></div>
      </section>

      <section class="panel">
        <div class="panel-h">
          <h2 id="rundown-title">Today's rundown</h2>
          <span class="label" id="rundown-meta"></span>
        </div>
        <div class="days" id="days" role="tablist" aria-label="Day of week"></div>
        <ol class="rundown" id="rundown"></ol>
        <div class="note-box">
          <label class="label" for="day-note">Day note: what helped, what got in the way</label>
          <textarea id="day-note" placeholder="e.g. Skipped editing, phone ate the afternoon. Try leaving it in the other room."></textarea>
        </div>
      </section>
    </div>

    <div class="side">
      <section class="panel">
        <div class="panel-h"><h2>Week board</h2><span class="label" id="week-label"></span></div>
        <div class="board-wrap"><table class="board" id="board"></table></div>
        <div class="legend">
          <span><i class="dot done"></i>Done</span>
          <span><i class="dot miss"></i>Not checked</span>
          <span><i class="dot plan"></i>Coming up</span>
        </div>
      </section>

      <div class="side-col">
        <section class="panel">
          <div class="panel-h"><h2>Hours per week</h2></div>
          <div class="copy"><table class="totals" id="totals"></table></div>
        </section>

        <section class="panel">
          <div class="panel-h"><h2>Backup</h2></div>
          <div class="copy">
            <p>Check-offs and notes are saved on this device. Export a backup now and then, or to move them to a new phone.</p>
            <div class="btns">
              <button class="btn" id="export-btn" type="button">Export backup</button>
              <button class="btn" id="import-btn" type="button">Import backup</button>
              <input id="import-file" type="file" accept="application/json,.json" hidden>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="schedule.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
</script>
</body>
</html>
